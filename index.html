<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam Hall Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div>
      <h1>Exam Hall Planner</h1>
      <p>Conflict-free student seating using backtracking</p>
    </div>
    <div class="badge">DSA Visualizer</div>
  </header>

  <section class="controls">
    <div class="control-card">
      <label>Hall Size</label>
      <input type="number" id="size" value="8" min="4" max="12">
    </div>

    <div class="control-card">
      <label>Animation Speed</label>
      <input type="range" id="speed" min="50" max="800" value="200">
    </div>

    <button class="primary-btn" onclick="start()">Generate Seating</button>
  </section>

  <section class="stats">
    <div class="stat-card">
      <span>Status</span>
      <h3 id="status">Ready</h3>
    </div>

    <div class="stat-card">
      <span>Students Placed</span>
      <h3 id="placed">0</h3>
    </div>
  </section>

  <section class="board-section">
    <div id="board"></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
